# =============================================================================
# Surcharge GPU NVIDIA (salle de formation, Ubuntu)
#
# Prérequis sur l'hôte : pilote NVIDIA + NVIDIA Container Toolkit
#   (vérifier avec :  docker run --rm --gpus all ubuntu:24.04 nvidia-smi)
#
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# =============================================================================
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
